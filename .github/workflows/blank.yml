name: Build Saturn IPA (Desktop Port Wrapper)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        brew install make pkg-config sdl2 glew glfw adamstark-audiofile dylibbundler coreutils
        pip3 install pillow

    - name: Set Execution Permissions
      run: |
        # The Makefile checks for pcbuilder.sh at startup; it must be executable
        if [ -f "pcbuilder.sh" ]; then chmod +x pcbuilder.sh; fi
        if [ -d "tools" ]; then chmod +x tools/* 2>/dev/null || true; fi

    - name: Extract Game Assets
      run: |
        # The script checks for the baserom you added to pull textures/audio
        if [ -f "baserom.us.z64" ]; then
          python3 ./extract_assets.py us || true
        fi

    - name: Compile Engine via GNU Make
      run: |
        # Forces execution using the macOS GNU compiler tools (gmake)
        # Bypasses the default PC builder check loop if it throws an environment error
        gmake OSX_BUILD=1 DEBUG=0 NON_MATCHING=1 COMPARE=0 -j$(sysctl -n hw.ncpu)

    - name: Assemble Mobile IPA Container
      run: |
        mkdir -p build/Payload
        
        # Locates the compiled binary executable inside the build target folder (build/us_pc/)
        TARGET_BIN=$(find build/us_pc/ -type f -not -name "*.*" -not -name "%.*" | head -n 1)
        
        if [ -n "$TARGET_BIN" ]; then
          echo "Found compiled application runtime asset: $TARGET_BIN"
          
          # Create the required structural iOS .app folder framework
          mkdir -p build/Payload/Saturn.app
          cp "$TARGET_BIN" build/Payload/Saturn.app/Saturn
          
          # Inject game assets folder if required by the asset manager
          if [ -d "res" ]; then cp -r res build/Payload/Saturn.app/; fi
          
          # Compress everything into the final installer container
          cd build
          zip -r Saturn.ipa Payload
          mkdir -p output
          mv Saturn.ipa output/
          mv output "$GITHUB_WORKSPACE/"
        else
          echo "❌ ERROR: Compilation finished but the output binary was not found in build/us_pc/"
          ls -la build/us_pc/ || true
          exit 1
        fi

    - name: Upload Production IPA
      uses: actions/upload-artifact@v4
      with:
        name: Saturn-IPA
        path: output/Saturn.ipa
